services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BASICAUTH}

  web:
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=8000
      - traefik.http.routers.apihost.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.apihost.entrypoints=websecure
      - traefik.http.routers.apihost.tls.certresolver=letsencrypt
      - traefik.http.routers.apihost.service=web
      - traefik.http.routers.whhost.rule=Host(`whatsapp.${DOMAIN}`)
      - traefik.http.routers.whhost.entrypoints=websecure
      - traefik.http.routers.whhost.tls.certresolver=letsencrypt
      - traefik.http.routers.whhost.service=web

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: ["celery", "--broker=${CELERY_BROKER_URL}", "flower", "--port=5555", "--url_prefix=flower"]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      FLOWER_UNAUTHENTICATED_API: "true"
    depends_on:
      - redis
    labels:
      - traefik.enable=true
      - traefik.http.routers.flower.rule=Host(`flower.${DOMAIN}`)
      - traefik.http.routers.flower.entrypoints=websecure
      - traefik.http.routers.flower.tls.certresolver=letsencrypt
      - traefik.http.routers.flower.middlewares=flower-auth
      - traefik.http.services.flower.loadbalancer.server.port=5555
      - traefik.http.middlewares.flower-auth.basicauth.users=${FLOWER_BASICAUTH}

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.status.rule=Host(`status.${DOMAIN}`)
      - traefik.http.routers.status.entrypoints=websecure
      - traefik.http.routers.status.tls.certresolver=letsencrypt
      - traefik.http.services.status.loadbalancer.server.port=3001

volumes:
  traefik_certs:
  uptime_kuma_data:
