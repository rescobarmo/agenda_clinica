{% extends "base.html" %}
{% block title %}Ingresar · Agenda Médica{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
  <h1 class="mb-1 text-2xl font-bold">Agenda Médica</h1>
  <p class="mb-6 text-sm text-gray-500">Inicia sesión para continuar</p>

  {% if form.errors %}
    <div class="mb-4 rounded-md bg-red-50 px-4 py-2 text-sm text-red-700">
      Usuario o contraseña incorrectos.
    </div>
  {% endif %}

  <form method="post" action="{% url 'login' %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="mb-1 block text-sm font-medium" for="id_username">Usuario</label>
      <input id="id_username" name="username" type="text" required
             class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium" for="id_password">Contraseña</label>
      <input id="id_password" name="password" type="password" required
             class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm" />
    </div>
    <button type="submit"
            class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
      Ingresar
    </button>
  </form>
</div>
{% endblock %}
