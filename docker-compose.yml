# Compose por defecto (EasyPanel) — autocontenido.
# Incluye db (Postgres) y redis para que baste con desplegar este único Compose Service.
# Sin `ports` y sin `container_name` (EasyPanel los marca como conflicto).
# Para un VPS "pelado" usa: docker-compose.vps.yml + docker-compose.vps.prod.yml
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      POSTGRES_USER: ${POSTGRES_USER:-agenda_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en Environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenda_app} -d ${POSTGRES_DB:-agenda}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_INIT: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-agenda_app}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-agenda}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "celery"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agenda_app}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-agenda}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

  whatsapp-worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "whatsapp"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agenda_app}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-agenda}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

  beat:
    build: .
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
      ]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agenda_app}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-agenda}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

volumes:
  postgres_data:
  redis_data:
