# Compose por defecto (EasyPanel).
# Usa los servicios nativos de EasyPanel para Postgres y Redis (no se definen aquí).
# Sin `ports` y sin `container_name` (EasyPanel los marca como conflicto).
# Para un VPS "pelado" usa: docker-compose.vps.yml + docker-compose.vps.prod.yml
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_INIT: "1"
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "celery"]
    env_file: .env

  whatsapp-worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "whatsapp"]
    env_file: .env

  beat:
    build: .
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
      ]
    env_file: .env
